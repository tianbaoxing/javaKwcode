server:
  port: 8080

spring:
  application:
    name: kwcode
  ai:
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: deepseek/deepseek-chat-v3-0324
          temperature: 0.1
          max-tokens: 4096
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3-8b
          temperature: 0.1
          max-tokens: 4096

kwcode:
  llm:
    default-provider: openrouter
    model-router:
      locator:
        openrouter: deepseek/deepseek-chat-v3-0324
        ollama: qwen3-8b
      generator:
        openrouter: anthropic/claude-sonnet-4
        ollama: qwen3-8b
      verifier:
        openrouter: deepseek/deepseek-chat-v3-0324
        ollama: qwen3-8b
      reviewer:
        openrouter: deepseek/deepseek-chat-v3-0324
        ollama: qwen3-8b
      planner:
        openrouter: deepseek/deepseek-chat-v3-0324
        ollama: qwen3-8b
    retry:
      max-attempts: 3
      backoff: exponential

logging:
  level:
    com.kwcode: DEBUG
    org.springframework.ai: DEBUG
